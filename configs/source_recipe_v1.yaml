{
  "version": 1,
  "authoritative_resolution_source": "configs/preprocessing_v1.yaml",
  "anchor": {
    "backbone": "dinov2_vitb14_reg4",
    "backbone_state": "frozen",
    "representation": ["class_token", "attention_pooled_patch_tokens"],
    "attention_pool": {"heads": 1, "query_source": "learned", "dropout": 0.0},
    "head": {"layers": [1536, 256, 1], "activation": "gelu", "dropout": 0.1},
    "optimizer": "adamw",
    "learning_rate": 0.0001,
    "weight_decay": 0.01,
    "max_epochs": 30,
    "checkpoint_rule": "lowest source-validation domain-macro ACER; ties use earlier epoch"
  },
  "branch_calibration": {
    "family": "monotone_affine_logistic",
    "slope_parameterization": "softplus_theta_plus_1e-6",
    "objective": "class_balanced_within_domain_equal_domain_bce",
    "solver": "lbfgs",
    "max_iterations": 500,
    "gradient_tolerance": 1e-8,
    "failure_policy": "mark run failed; do not replace seed"
  },
  "risk_model": {
    "family": "logistic_regression",
    "regularization": "l2",
    "inverse_regularization_strength": 1.0,
    "solver": "lbfgs",
    "max_iterations": 1000,
    "objective": "natural_prevalence_within_domain_equal_domain_bce"
  },
  "source_threshold": {
    "primary_alpha": 0.05,
    "selection_rule": "largest threshold satisfying empirical APCER <= alpha in every source domain",
    "tie_breaker": "lowest source-domain-macro BPCER",
    "infeasible_fallback": "report no feasible constrained threshold; use pooled empirical alpha only as nominal diagnostic"
  },
  "latency_scope": "VLM branch including decode, fixed detector/crop preprocessing, transfer, and synchronized forward pass",
  "no_candidate_under_ceiling": "retain the lowest-latency candidate as a diagnostic and declare conditional deployment criterion failed"
}
